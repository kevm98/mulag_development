<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="600" version="1.1" viewBox="0 0 1500 600" width="1500" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="aO" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#C97816"/></marker>
<marker id="aB" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F5DA8"/></marker>
<marker id="aT" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#16847A"/></marker>
<marker id="aR" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#B64B42"/></marker>
<marker id="aG" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#69737D"/></marker>
</defs>
<rect fill="#FFFFFF" height="600" width="1500" x="0" y="0"/>

<!-- feedback arcs (drawn first, kept above capsules) -->
<path d="M 745,130 C 640,55 350,55 250,128" fill="none" marker-end="url(#aR)" stroke="#B64B42" stroke-dasharray="7,5" stroke-width="2.2"/>
<rect fill="#FFFFFF" height="40" rx="6" ry="6" stroke="#B64B42" stroke-width="1.2" width="320" x="335" y="48"/>
<text fill="#B64B42" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="495" y="65">load-pressure feedback</text>
<text fill="#B64B42" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="495" y="82">flow gain shrinks as load approaches supply</text>

<path d="M 1245,130 C 1150,30 850,30 755,124" fill="none" marker-end="url(#aG)" stroke="#69737D" stroke-dasharray="7,5" stroke-width="2.2"/>
<rect fill="#FFFFFF" height="40" rx="6" ry="6" stroke="#69737D" stroke-width="1.2" width="300" x="850" y="26"/>
<text fill="#69737D" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="1000" y="43">displacement flow A&#183;xdot</text>
<text fill="#69737D" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="1000" y="60">a moving piston consumes flow before pressure builds</text>

<!-- ================= ELECTRICAL capsule ================= -->
<rect fill="#FFFBF4" height="290" rx="18" ry="18" stroke="#C97816" stroke-width="2.2" width="360" x="60" y="130"/>
<text fill="#C97816" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="2" text-anchor="middle" x="240" y="162">ELECTRICAL</text>

<rect fill="#FFF4E5" height="70" rx="10" ry="10" stroke="#C97816" stroke-width="2.0" width="300" x="90" y="185"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="240" y="214">Valve command</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="240" y="238">u in [&#8722;1, 1] per cylinder</text>

<line marker-end="url(#aO)" stroke="#C97816" stroke-width="2.4" x1="240" x2="240" y1="255" y2="285"/>

<rect fill="#FFF4E5" height="80" rx="10" ry="10" stroke="#C97816" stroke-width="2.0" width="300" x="90" y="285"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="240" y="315">Proportional valve</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="240" y="339">spool displacement opens</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="240" y="357">metering orifices</text>

<!-- ================= HYDRAULIC capsule ================= -->
<rect fill="#F8FBFF" height="290" rx="18" ry="18" stroke="#2F5DA8" stroke-width="2.2" width="380" x="550" y="130"/>
<text fill="#2F5DA8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="2" text-anchor="middle" x="740" y="162">HYDRAULIC</text>

<rect fill="#EEF4FF" height="70" rx="10" ry="10" stroke="#2F5DA8" stroke-width="2.0" width="320" x="580" y="185"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="740" y="214">Volumetric flow q</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="740" y="238">orifice law: q &#8733; x_v &#183; &#8730;(p_s &#8722; p_load)</text>

<line marker-end="url(#aB)" stroke="#2F5DA8" stroke-width="2.4" x1="740" x2="740" y1="255" y2="285"/>

<rect fill="#EEF4FF" height="80" rx="10" ry="10" stroke="#2F5DA8" stroke-width="2.0" width="320" x="580" y="285"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="740" y="315">Chamber pressures &#916;p</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="740" y="339">compressible oil in stroke-dependent</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="740" y="357">volumes; relief valves clip transients</text>

<!-- ================= MECHANICAL capsule ================= -->
<rect fill="#F6FBFA" height="290" rx="18" ry="18" stroke="#16847A" stroke-width="2.2" width="400" x="1040" y="130"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="2" text-anchor="middle" x="1240" y="162">MECHANICAL</text>

<rect fill="#ECF8F6" height="70" rx="10" ry="10" stroke="#16847A" stroke-width="2.0" width="340" x="1070" y="185"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1240" y="214">Cylinder motion x, xdot</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="1240" y="238">force accelerates piston against friction</text>

<line marker-end="url(#aT)" stroke="#16847A" stroke-width="2.4" x1="1240" x2="1240" y1="255" y2="285"/>

<rect fill="#ECF8F6" height="80" rx="10" ry="10" stroke="#16847A" stroke-width="2.0" width="340" x="1070" y="285"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1240" y="315">Linkage and joints</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="1240" y="339">configuration-dependent lever arms</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="1240" y="357">turn stroke into mowing-head motion</text>

<!-- inter-capsule arrows -->
<line marker-end="url(#aB)" stroke="#2F5DA8" stroke-width="3.0" x1="420" x2="550" y1="270" y2="270"/>
<text fill="#2F5DA8" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="485" y="258">spool x_v</text>

<line marker-end="url(#aT)" stroke="#16847A" stroke-width="3.0" x1="930" x2="1040" y1="270" y2="270"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="985" y="258">force F</text>

<!-- nonlinearity pills -->
<g font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold">
<rect fill="#FFFFFF" height="30" rx="15" ry="15" stroke="#C97816" stroke-width="1.5" width="104" x="70" y="442"/><text fill="#C97816" text-anchor="middle" x="122" y="461">dead zone</text>
<rect fill="#FFFFFF" height="30" rx="15" ry="15" stroke="#C97816" stroke-width="1.5" width="104" x="188" y="442"/><text fill="#C97816" text-anchor="middle" x="240" y="461">saturation</text>
<rect fill="#FFFFFF" height="30" rx="15" ry="15" stroke="#C97816" stroke-width="1.5" width="130" x="306" y="442"/><text fill="#C97816" text-anchor="middle" x="371" y="461">asymmetric gain</text>
<rect fill="#FFFFFF" height="30" rx="15" ry="15" stroke="#2F5DA8" stroke-width="1.5" width="116" x="560" y="442"/><text fill="#2F5DA8" text-anchor="middle" x="618" y="461">entrained air</text>
<rect fill="#FFFFFF" height="30" rx="15" ry="15" stroke="#2F5DA8" stroke-width="1.5" width="120" x="690" y="442"/><text fill="#2F5DA8" text-anchor="middle" x="750" y="461">relief clipping</text>
<rect fill="#FFFFFF" height="30" rx="15" ry="15" stroke="#2F5DA8" stroke-width="1.5" width="90" x="824" y="442"/><text fill="#2F5DA8" text-anchor="middle" x="869" y="461">leakage</text>
<rect fill="#FFFFFF" height="30" rx="15" ry="15" stroke="#16847A" stroke-width="1.5" width="86" x="1060" y="442"/><text fill="#16847A" text-anchor="middle" x="1103" y="461">stiction</text>
<rect fill="#FFFFFF" height="30" rx="15" ry="15" stroke="#16847A" stroke-width="1.5" width="94" x="1160" y="442"/><text fill="#16847A" text-anchor="middle" x="1207" y="461">end stops</text>
<rect fill="#FFFFFF" height="30" rx="15" ry="15" stroke="#16847A" stroke-width="1.5" width="156" x="1268" y="442"/><text fill="#16847A" text-anchor="middle" x="1346" y="461">lever-arm variation</text>
</g>

<!-- takeaway ribbon -->
<rect fill="#F8FAFC" height="48" rx="10" ry="10" stroke="#B8C1CA" stroke-width="1.6" width="1380" x="60" y="510"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle" x="750" y="540">The composite gain from valve command to head motion is an operating point &#8212; it changes with load, configuration, and fluid state &#8212; and it is exactly what the learned actuator models must capture.</text>
</svg>
