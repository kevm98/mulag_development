<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="160" y="300">Desired command</text>
<text fill="#7A52A8" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="160" y="326">c&#8342; = [&#916;x*, &#916;xdot*]</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="160" y="350">8-D, from the DLS layer</text>

<!-- ============ lane 1: PPO1 ============ -->
<rect fill="#F8FBFF" height="190" rx="14" ry="14" stroke="#2F5DA8" stroke-width="1.8" width="880" x="330" y="90"/>
<text fill="#2F5DA8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" x="355" y="122">PPO1 path &#8212; two separate networks</text>

