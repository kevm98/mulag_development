<rect fill="#FFFFFF" height="30" rx="8" ry="8" stroke="#16847A" stroke-width="1.5" width="120" x="678" y="478"/><text fill="#16847A" x="738" y="498">pressure &#916;p&#770;</text>
<rect fill="#FFFFFF" height="30" rx="8" ry="8" stroke="#16847A" stroke-width="1.5" width="120" x="826" y="478"/><text fill="#16847A" x="886" y="498">velocity xdot&#770;</text>
