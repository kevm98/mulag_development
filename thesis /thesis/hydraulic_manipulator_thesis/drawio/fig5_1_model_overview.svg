<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" x="390" y="470">GRU over 0.25 s history + physical update laws; the valve is internal, never an input</text>
<g font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
<rect fill="#FFFFFF" height="30" rx="8" ry="8" stroke="#16847A" stroke-width="1.5" width="110" x="392" y="478"/><text fill="#16847A" x="447" y="498">GRU 2&#215;128</text>
