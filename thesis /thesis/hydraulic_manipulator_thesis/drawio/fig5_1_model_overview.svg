<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="505" y="178">Inverse dynamics  f_ID</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="505" y="200">28 &#8594; 4 residual MLP</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="505" y="220">state + target &#8594; valve change</text>

<line marker-end="url(#aB)" stroke="#2F5DA8" stroke-width="2.6" x1="645" x2="805" y1="190" y2="190"/>
<text fill="#2F5DA8" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="725" y="178">valve u&#8342;</text>

<rect fill="#EEF4FF" height="90" rx="10" ry="10" stroke="#2F5DA8" stroke-width="2.0" width="280" x="805" y="145"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="945" y="178">Forward dynamics  f_FD</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="945" y="200">20 &#8594; 12 residual MLP</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="945" y="220">valve + state &#8594; increments</text>

<!-- ============ lane 2: PPO2 ============ -->
<rect fill="#F6FBFA" height="190" rx="14" ry="14" stroke="#16847A" stroke-width="1.8" width="880" x="330" y="360"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" x="355" y="392">PPO2 path &#8212; one grey-box reduced-order model</text>

