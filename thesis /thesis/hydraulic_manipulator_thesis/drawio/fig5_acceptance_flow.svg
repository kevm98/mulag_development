<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1150" version="1.1" viewBox="0 0 1240 1150" width="1240" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="aG" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#69737D"/></marker>
<marker id="aR" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#B64B42"/></marker>
<marker id="aT" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#16847A"/></marker>
</defs>
<rect fill="#FFFFFF" height="1150" width="1240" x="0" y="0"/>

<!-- start terminal -->
<rect fill="#EEF4FF" height="56" rx="28" ry="28" stroke="#2F5DA8" stroke-width="2.2" width="380" x="240" y="40"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="430" y="63">Candidate model</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="430" y="83">trained on the Chapter-4 datasets</text>

<line marker-end="url(#aG)" stroke="#69737D" stroke-width="2.2" x1="430" x2="430" y1="96" y2="132"/>

<!-- D1 -->
<polygon fill="#F8FAFC" points="430,132 660,207 430,282 200,207" stroke="#69737D" stroke-width="2.2"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="430" y="196">Offline accuracy?</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="430" y="218">one-step and recursive-rollout</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="430" y="236">metrics on held-out runs</text>

<line marker-end="url(#aR)" stroke="#B64B42" stroke-width="2.2" x1="660" x2="790" y1="207" y2="207"/>
<text fill="#B64B42" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" x="700" y="196">no</text>
<rect fill="#FFF4E5" height="66" rx="10" ry="10" stroke="#C97816" stroke-width="2" width="330" x="790" y="174"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="955" y="201">Revise objective or architecture</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="955" y="222">rollout weights, losses, capacity &#8594; retrain</text>

<line marker-end="url(#aT)" stroke="#16847A" stroke-width="2.2" x1="430" x2="430" y1="282" y2="318"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" x="442" y="306">yes</text>

<!-- D2 -->
<polygon fill="#F8FAFC" points="430,318 660,393 430,468 200,393" stroke="#69737D" stroke-width="2.2"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="430" y="382">Input authority?</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="430" y="404">zeroed and shuffled commands</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="430" y="422">must clearly degrade prediction</text>

<line marker-end="url(#aR)" stroke="#B64B42" stroke-width="2.2" x1="660" x2="790" y1="393" y2="393"/>
<text fill="#B64B42" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" x="700" y="382">no</text>
<rect fill="#FDF0EF" height="66" rx="10" ry="10" stroke="#B64B42" stroke-width="2" width="330" x="790" y="360"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="955" y="387">Data are not identifiable</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="955" y="408">new excitation campaign (Chapter 4)</text>

<line marker-end="url(#aT)" stroke="#16847A" stroke-width="2.2" x1="430" x2="430" y1="468" y2="504"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" x="442" y="492">yes</text>

<!-- D3 -->
<polygon fill="#F8FAFC" points="430,504 660,579 430,654 200,579" stroke="#69737D" stroke-width="2.2"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="430" y="568">In-simulator gates?</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="430" y="590">fresh cylinder steps, out-and-back</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="430" y="608">returns, smoothness, no saturation</text>

<line marker-end="url(#aR)" stroke="#B64B42" stroke-width="2.2" x1="660" x2="790" y1="579" y2="579"/>
<text fill="#B64B42" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" x="700" y="568">no</text>
<rect fill="#FFF4E5" height="66" rx="10" ry="10" stroke="#C97816" stroke-width="2" width="330" x="790" y="546"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="955" y="573">Fix the runtime contract</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="955" y="594">blending, integration, normalization</text>

<line marker-end="url(#aT)" stroke="#16847A" stroke-width="2.2" x1="430" x2="430" y1="654" y2="690"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" x="442" y="678">yes</text>

<!-- D4 -->
<polygon fill="#F8FAFC" points="430,690 660,765 430,840 200,765" stroke="#69737D" stroke-width="2.2"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="430" y="754">Task-space gate?</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="430" y="776">mean / p95 error, oscillation,</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="430" y="794">head alignment, truck drift</text>

<line marker-end="url(#aR)" stroke="#B64B42" stroke-width="2.2" x1="660" x2="790" y1="765" y2="765"/>
<text fill="#B64B42" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" x="700" y="754">no</text>
<rect fill="#FFF4E5" height="66" rx="10" ry="10" stroke="#C97816" stroke-width="2" width="330" x="790" y="732"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="955" y="759">Tune the controller layer</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="955" y="780">DLS smoothing, lead, residual authority</text>

<line marker-end="url(#aT)" stroke="#16847A" stroke-width="2.4" x1="430" x2="430" y1="840" y2="884"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" x="442" y="868">yes</text>

<!-- promote terminal -->
<rect fill="#ECF8F6" height="64" rx="32" ry="32" stroke="#16847A" stroke-width="2.6" width="420" x="220" y="884"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="430" y="911">Promote checkpoint</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="430" y="932">artifact + SHA-256 hash recorded for provenance</text>

<!-- iterate hints -->
<g font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-style="italic" fill="#66727E" text-anchor="middle">
<text x="955" y="262">&#8635; retrain and re-enter at the top</text>
<text x="955" y="448">&#8635; new data, then re-enter at the top</text>
<text x="955" y="634">&#8635; re-run the in-simulator gates</text>
<text x="955" y="820">&#8635; re-run the tracking gate</text>
</g>

<!-- principle note -->
<rect fill="#F8FAFC" height="52" rx="10" ry="10" stroke="#B8C1CA" stroke-width="1.6" width="1000" x="120" y="1010"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle" x="620" y="1042">A high supervised score alone never promotes a model &#8212; every gate below it must pass first.</text>
</svg>
