<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><rect width="1000" height="600" fill="#FFFFFF"/><defs><marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#1F2933"/></marker><marker id="arrowgray" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#69737D"/></marker><marker id="arrowpurple" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7A52A8"/></marker></defs><text x="500" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#1F2933" font-weight="bold" font-style="normal" text-anchor="middle">From raw policy output to PhysX cylinder target</text><text x="500" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#66727E" font-weight="normal" font-style="normal" text-anchor="middle">every stage can only REDUCE authority</text><rect x="158.0" y="100" width="216" height="78" rx="10" ry="10" fill="#FBE7C6" stroke="#C97816" stroke-width="2.2"/><text x="266.0" y="132" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#8a5410" font-weight="bold" font-style="normal" text-anchor="middle">raw action</text><text x="266.0" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#1F2933" font-weight="normal" font-style="normal" text-anchor="middle">a &#8712; &#8477;&#8308;</text><line x1="376.0" y1="139.0" x2="388.0" y2="139.0" stroke="#1F2933" stroke-width="2.2" marker-end="url(#arrowhead)"/><rect x="392.0" y="100" width="216" height="78" rx="10" ry="10" fill="#DCE6F2" stroke="#2F5DA8" stroke-width="2.2"/><text x="500.0" y="132" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#1e3f72" font-weight="bold" font-style="normal" text-anchor="middle">rate limit</text><text x="500.0" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#1F2933" font-weight="normal" font-style="normal" text-anchor="middle">|&#916;a| &#8804; 0.25 / step</text><line x1="610.0" y1="139.0" x2="622.0" y2="139.0" stroke="#1F2933" stroke-width="2.2" marker-end="url(#arrowhead)"/><rect x="626.0" y="100" width="216" height="78" rx="10" ry="10" fill="#DCE6F2" stroke="#2F5DA8" stroke-width="2.2"/><text x="734.0" y="132" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#1e3f72" font-weight="bold" font-style="normal" text-anchor="middle">EMA filter</text><text x="734.0" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#1F2933" font-weight="normal" font-style="normal" text-anchor="middle">&#946; = 0.70</text><path d="M734.0 178 L734.0 200 L266.0 200 L266.0 218" fill="none" stroke="#1F2933" stroke-width="2.2" marker-end="url(#arrowhead)"/><rect x="158.0" y="222" width="216" height="78" rx="10" ry="10" fill="#DCE6F2" stroke="#2F5DA8" stroke-width="2.2"/><text x="266.0" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#1e3f72" font-weight="bold" font-style="normal" text-anchor="middle">limit shield</text><text x="266.0" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#1F2933" font-weight="normal" font-style="normal" text-anchor="middle">fades over 20 mm</text><line x1="376.0" y1="261.0" x2="388.0" y2="261.0" stroke="#1F2933" stroke-width="2.2" marker-end="url(#arrowhead)"/><rect x="392.0" y="222" width="216" height="78" rx="10" ry="10" fill="#E8F1EF" stroke="#16847A" stroke-width="2.2"/><text x="500.0" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#0e5f58" font-weight="bold" font-style="normal" text-anchor="middle">command scale</text><text x="500.0" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#1F2933" font-weight="normal" font-style="normal" text-anchor="middle">&#215; 4 mm per unit</text><line x1="610.0" y1="261.0" x2="622.0" y2="261.0" stroke="#1F2933" stroke-width="2.2" marker-end="url(#arrowhead)"/><rect x="626.0" y="222" width="216" height="78" rx="10" ry="10" fill="#E8F1EF" stroke="#16847A" stroke-width="2.2"/><text x="734.0" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#0e5f58" font-weight="bold" font-style="normal" text-anchor="middle">target integrator</text><text x="734.0" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#1F2933" font-weight="normal" font-style="normal" text-anchor="middle">lead &#8804; 18 mm</text><path d="M734.0 300 L734.0 322 L266.0 322 L266.0 340" fill="none" stroke="#1F2933" stroke-width="2.2" marker-end="url(#arrowhead)"/><rect x="392.0" y="344" width="216" height="78" rx="10" ry="10" fill="#E7DFF2" stroke="#7A52A8" stroke-width="2.2"/><text x="500.0" y="376" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#4b3170" font-weight="bold" font-style="normal" text-anchor="middle">actuator + PhysX</text><text x="500.0" y="402" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#1F2933" font-weight="normal" font-style="normal" text-anchor="middle">ROM | ID&#8594;FD | +adapter</text><rect x="40" y="440" width="920" height="140" rx="12" ry="12" fill="#FDF3F2" stroke="#B64B42" stroke-width="1.8"/><text x="500" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#7d332c" font-weight="bold" font-style="normal" text-anchor="middle">The ceiling this implies</text><text x="500" y="498" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1F2933" font-weight="normal" font-style="normal" text-anchor="middle">4 mm of cylinder travel per step is the entire authority budget, and it bounds</text><text x="500" y="522" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1F2933" font-weight="normal" font-style="normal" text-anchor="middle">the lateral cutter rate at roughly 0.2 m/s. Reference paths are DERIVED from</text><text x="500" y="546" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1F2933" font-weight="normal" font-style="normal" text-anchor="middle">that ceiling, and a preflight check refuses a run on a path that demands more.</text></svg>