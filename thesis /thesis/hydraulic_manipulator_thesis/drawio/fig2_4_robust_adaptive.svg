<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="aO" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#C97816"/></marker>
<marker id="aT" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#16847A"/></marker>
<marker id="aG" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#69737D"/></marker>
</defs>
<rect fill="#FFFFFF" height="820" width="1500" x="0" y="0"/>

<!-- ============ shared plant family (top center) ============ -->
<rect fill="#FFFFFF" height="86" rx="10" ry="10" stroke="#69737D" stroke-width="1.6" width="300" x="624" y="74"/>
<rect fill="#FFFFFF" height="86" rx="10" ry="10" stroke="#69737D" stroke-width="1.6" width="300" x="612" y="62"/>
<rect fill="#F1F3F5" height="86" rx="10" ry="10" stroke="#69737D" stroke-width="2.0" width="300" x="600" y="50"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="750" y="84">Randomized plant family</text>
<text fill="#69737D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="750" y="108">{ P(&#958;) }</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="750" y="188">&#958;: bulk modulus, valve gain and offset, leakage, friction, payload, &#8230;  (Chapter 4)</text>

<polyline fill="none" marker-end="url(#aG)" points="640,160 400,160 400,230" stroke="#69737D" stroke-width="2.4"/>
<polyline fill="none" marker-end="url(#aG)" points="860,160 1100,160 1100,230" stroke="#69737D" stroke-width="2.4"/>

<!-- ============ LEFT CARD: robust ============ -->
<rect fill="#FFFDF9" height="500" rx="18" ry="18" stroke="#C97816" stroke-width="2.4" width="620" x="90" y="230"/>
<rect fill="#FFF4E5" height="52" rx="18" ry="18" stroke="none" width="616" x="92" y="232"/>
<text fill="#C97816" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" x="120" y="265">(a)  ROBUST &#8212; randomized training only</text>
<rect fill="#FFFFFF" height="30" rx="15" ry="15" stroke="#C97816" stroke-width="1.6" width="170" x="520" y="243"/>
<text fill="#C97816" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="605" y="263">PPO1-B / PPO2-B</text>

<rect fill="#FFFFFF" height="64" rx="10" ry="10" stroke="#C97816" stroke-width="2.0" width="440" x="180" y="316"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="400" y="342">Training data pooled over every &#958;</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="400" y="365">the model never learns which plant is active</text>

<line marker-end="url(#aO)" stroke="#C97816" stroke-width="2.4" x1="400" x2="400" y1="380" y2="412"/>

<rect fill="#FFF4E5" height="64" rx="10" ry="10" stroke="#C97816" stroke-width="2.0" width="440" x="180" y="412"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="400" y="438">One fixed model  f&#952;</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="400" y="461">identical parameters at deployment</text>

<line marker-end="url(#aO)" stroke="#C97816" stroke-width="2.4" x1="400" x2="400" y1="476" y2="508"/>

<rect fill="#FFFFFF" height="64" rx="10" ry="10" stroke="#C97816" stroke-width="2.0" width="440" x="180" y="508"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="400" y="534">One compromise response for all plants</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="400" y="557">tuned to the family average, not to the machine at hand</text>

<rect fill="#FFF4E5" height="86" rx="10" ry="10" stroke="#C97816" stroke-width="1.6" width="440" x="180" y="614"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" x="205" y="646">&#10003;  tolerates parameter variation</text>
<text fill="#B64B42" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" x="205" y="678">&#10007;  optimal nowhere; cannot react to change</text>

<!-- ============ RIGHT CARD: adaptive ============ -->
<rect fill="#F9FCFB" height="500" rx="18" ry="18" stroke="#16847A" stroke-width="2.4" width="620" x="790" y="230"/>
<rect fill="#ECF8F6" height="52" rx="18" ry="18" stroke="none" width="616" x="792" y="232"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" x="820" y="265">(b)  ADAPTIVE &#8212; latent conditioning</text>
<rect fill="#FFFFFF" height="30" rx="15" ry="15" stroke="#16847A" stroke-width="1.6" width="200" x="1190" y="243"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="1290" y="263">PPO2-C, this thesis</text>

<rect fill="#FFFFFF" height="64" rx="10" ry="10" stroke="#16847A" stroke-width="2.0" width="440" x="880" y="316"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1100" y="342">Recent measured history (0.25 s)</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="1100" y="365">cylinder motion, pressures, commands</text>

<line marker-end="url(#aT)" stroke="#16847A" stroke-width="2.4" x1="1100" x2="1100" y1="380" y2="412"/>

<rect fill="#ECF8F6" height="64" rx="10" ry="10" stroke="#16847A" stroke-width="2.0" width="440" x="880" y="412"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1100" y="438">AAM estimator  &#8594;  latent  z&#770;</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="1100" y="461">trained against teacher latent z(&#958;); no gradients online</text>

<line marker-end="url(#aT)" stroke="#16847A" stroke-width="2.4" x1="1100" x2="1100" y1="476" y2="508"/>

<rect fill="#FFFFFF" height="64" rx="10" ry="10" stroke="#16847A" stroke-width="2.0" width="440" x="880" y="508"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1100" y="534">Conditioned model  f&#952;( &#183; ; z&#770; )</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="1100" y="557">response specialized to the currently active plant</text>

<rect fill="#ECF8F6" height="86" rx="10" ry="10" stroke="#16847A" stroke-width="1.6" width="440" x="880" y="614"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" x="905" y="646">&#10003;  matches the plant it is actually on</text>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" x="905" y="678">&#10003;  re-adapts within fractions of a second</text>

<!-- bottom note -->
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle" x="750" y="782">The experiments keep (a) and (b) separate so that robustness and adaptation are measured as distinct effects.</text>
</svg>
