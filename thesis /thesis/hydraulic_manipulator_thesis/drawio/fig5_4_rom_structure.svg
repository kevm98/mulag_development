<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640" version="1.1" viewBox="0 0 1500 640" width="1500" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="aB" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F5DA8"/></marker>
<marker id="aT" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#16847A"/></marker>
<marker id="aP" markerHeight="9" markerUnits="strokeWidth" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A52A8"/></marker>
</defs>
<rect fill="#FFFFFF" height="640" width="1500" x="0" y="0"/>

<!-- history stack -->
<rect fill="#FFFFFF" height="110" rx="10" ry="10" stroke="#7A52A8" stroke-width="1.6" width="230" x="84" y="164"/>
<rect fill="#FFFFFF" height="110" rx="10" ry="10" stroke="#7A52A8" stroke-width="1.6" width="230" x="72" y="152"/>
<rect fill="#F6F0FB" height="110" rx="10" ry="10" stroke="#7A52A8" stroke-width="2.2" width="230" x="60" y="140"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="175" y="180">History  H&#8342;</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="175" y="205">6 &#215; 24 samples (0.25 s)</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="175" y="228">state + previous u&#770; + command</text>

<line marker-end="url(#aB)" stroke="#7A52A8" stroke-width="2.6" x1="314" x2="390" y1="195" y2="195"/>

<!-- GRU -->
<rect fill="#EEF4FF" height="90" rx="10" ry="10" stroke="#2F5DA8" stroke-width="2.2" width="220" x="390" y="150"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="500" y="185">GRU encoder</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="500" y="210">2 layers &#215; 128</text>

<line marker-end="url(#aB)" stroke="#2F5DA8" stroke-width="2.6" x1="610" x2="690" y1="195" y2="195"/>
<text fill="#2F5DA8" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="650" y="183">h&#8342;</text>

<!-- actuation head -->
<rect fill="#EEF4FF" height="90" rx="10" ry="10" stroke="#2F5DA8" stroke-width="2.2" width="250" x="690" y="150"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="815" y="185">Actuation head</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="815" y="210">learnable smooth dead zone</text>

<line marker-end="url(#aT)" stroke="#2F5DA8" stroke-width="2.6" x1="940" x2="1020" y1="195" y2="195"/>
<text fill="#2F5DA8" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="980" y="183">u&#770;&#8342;</text>

<!-- physics container -->
<rect fill="#F6FBFA" height="440" rx="16" ry="16" stroke="#16847A" stroke-width="2.4" width="400" x="1020" y="80"/>
<text fill="#16847A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1220" y="112">Physical update laws</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="1220" y="134">trainable effective parameters, clamped</text>

<rect fill="#ECF8F6" height="70" rx="10" ry="10" stroke="#16847A" stroke-width="2.0" width="330" x="1055" y="155"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1220" y="184">Pressure update</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="1220" y="207">orifice flow and continuity</text>

<line marker-end="url(#aT)" stroke="#16847A" stroke-width="2.4" x1="1220" x2="1220" y1="225" y2="255"/>

<rect fill="#ECF8F6" height="70" rx="10" ry="10" stroke="#16847A" stroke-width="2.0" width="330" x="1055" y="255"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1220" y="284">Force and velocity update</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="1220" y="307">friction, neural load head</text>

<line marker-end="url(#aT)" stroke="#16847A" stroke-width="2.4" x1="1220" x2="1220" y1="325" y2="355"/>

<rect fill="#ECF8F6" height="70" rx="10" ry="10" stroke="#16847A" stroke-width="2.0" width="330" x="1055" y="355"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1220" y="384">Trapezoidal integration</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" x="1220" y="407">extension increment</text>

<line marker-end="url(#aT)" stroke="#16847A" stroke-width="2.6" x1="1220" x2="1220" y1="450" y2="490"/>

<rect fill="#F1F3F5" height="56" rx="10" ry="10" stroke="#69737D" stroke-width="2.0" width="400" x="1020" y="490"/>
<text fill="#1F2933" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="1220" y="514">&#916;p&#770;, &#916;xdot&#770;, &#916;x&#770;  &#8594;  next state and PhysX target</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="1220" y="534">u&#770; feeds back into the next history window</text>

<!-- bounded residual rail -->
<polyline fill="none" points="500,240 500,440 1035,440" stroke="#7A52A8" stroke-dasharray="7,5" stroke-width="2.2"/>
<line marker-end="url(#aP)" stroke="#7A52A8" stroke-dasharray="7,5" stroke-width="2.2" x1="1035" x2="1055" y1="440" y2="410"/>
<line marker-end="url(#aP)" stroke="#7A52A8" stroke-dasharray="7,5" stroke-width="2.2" x1="1035" x2="1055" y1="440" y2="300"/>
<line marker-end="url(#aP)" stroke="#7A52A8" stroke-dasharray="7,5" stroke-width="2.2" x1="1035" x2="1055" y1="440" y2="195"/>
<rect fill="#FFFFFF" height="44" rx="8" ry="8" stroke="#7A52A8" stroke-width="1.6" width="360" x="560" y="418"/>
<text fill="#7A52A8" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="740" y="437">bounded residual corrections from h&#8342;</text>
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="740" y="455">tanh-limited: 10% pressure, 10% velocity, 1 cm position</text>

<!-- takeaway -->
<text fill="#66727E" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle" x="750" y="605">Neural parts propose; bounded physics disposes &#8212; even off-distribution inputs cannot produce an unphysical state jump.</text>
</svg>
