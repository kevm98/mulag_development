<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#18304b"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#a8bfd7"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#47d7a6"/></marker>
    <style>
      .title{font:700 42px sans-serif;fill:#f4f8ff}.sub{font:500 20px sans-serif;fill:#b7c9dd}
      .h{font:700 20px sans-serif;fill:#fff}.b{font:500 16px sans-serif;fill:#dce7f2}.s{font:500 14px sans-serif;fill:#bad0e4}
      .box{rx:18;stroke-width:2}.flow{fill:none;stroke:#a8bfd7;stroke-width:4;marker-end:url(#a)}
      .fb{fill:none;stroke:#47d7a6;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#g)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="65" y="65" class="title">MULAG Stop-and-Mow Control Pipeline</text>
  <text x="65" y="100" class="sub">The parked hydraulic arm draws every path; the truck only relocates between completed passes</text>

  <rect x="55" y="135" width="1490" height="170" rx="24" fill="#12263c" stroke="#3c719f" stroke-width="2"/>
  <text x="80" y="170" class="h">Operational state machine</text>
  <g>
    <rect x="80" y="195" width="200" height="75" class="box" fill="#245078" stroke="#61a6dc"/><text x="180" y="225" class="h" text-anchor="middle">1  PARK + BRAKE</text><text x="180" y="250" class="s" text-anchor="middle">truck motion disabled</text>
    <path d="M280 232h55" class="flow"/>
    <rect x="335" y="195" width="245" height="75" class="box" fill="#176159" stroke="#47d7a6"/><text x="458" y="225" class="h" text-anchor="middle">2  ARM WORK</text><text x="458" y="250" class="s" text-anchor="middle">curve or out-and-back sweep</text>
    <path d="M580 232h55" class="flow"/>
    <rect x="635" y="195" width="200" height="75" class="box" fill="#6a4c25" stroke="#e5ac57"/><text x="735" y="225" class="h" text-anchor="middle">3  RETURN + LIFT</text><text x="735" y="250" class="s" text-anchor="middle">rams stow cutter</text>
    <path d="M835 232h55" class="flow"/>
    <rect x="890" y="195" width="210" height="75" class="box" fill="#245078" stroke="#61a6dc"/><text x="995" y="225" class="h" text-anchor="middle">4  TRUCK ADVANCE</text><text x="995" y="250" class="s" text-anchor="middle">straight ~0.5 m only</text>
    <path d="M1100 232h55" class="flow"/>
    <rect x="1155" y="195" width="190" height="75" class="box" fill="#245078" stroke="#61a6dc"/><text x="1250" y="225" class="h" text-anchor="middle">5  BRAKE</text><text x="1250" y="250" class="s" text-anchor="middle">settle at new row</text>
    <path d="M1345 232h65v-55H180v18" class="flow"/>
  </g>

  <text x="65" y="355" class="h">Parked arm controller</text>
  <rect x="65" y="385" width="220" height="105" class="box" fill="#684826" stroke="#e5ac57"/>
  <text x="175" y="418" class="h" text-anchor="middle">Ground path</text><text x="175" y="445" class="b" text-anchor="middle">truck base_link frame</text><text x="175" y="470" class="s" text-anchor="middle">cutter is control point</text>
  <path d="M285 438h55" class="flow"/>
  <rect x="340" y="385" width="230" height="105" class="box" fill="#176159" stroke="#47d7a6"/>
  <text x="455" y="418" class="h" text-anchor="middle">Cutter DLS IK</text><text x="455" y="445" class="b" text-anchor="middle">cached PhysX 3 x 4 J</text><text x="455" y="470" class="s" text-anchor="middle">CPU SVD · damping</text>
  <path d="M570 438h55" class="flow"/>
  <rect x="625" y="385" width="230" height="105" class="box" fill="#176159" stroke="#47d7a6"/>
  <text x="740" y="418" class="h" text-anchor="middle">Cylinder setpoint</text><text x="740" y="445" class="b" text-anchor="middle">4 coupled ram lengths</text><text x="740" y="470" class="s" text-anchor="middle">bounded IK increments</text>
  <path d="M855 438h55" class="flow"/>
  <rect x="910" y="385" width="255" height="105" class="box" fill="#176159" stroke="#47d7a6"/>
  <text x="1038" y="418" class="h" text-anchor="middle">Cylinder DLS</text><text x="1038" y="445" class="b" text-anchor="middle">goal - measured cylinders</text><text x="1038" y="470" class="s" text-anchor="middle">full coupled 4 x 4 control</text>
  <path d="M1165 438h55" class="flow"/>
  <rect x="1220" y="385" width="310" height="105" class="box" fill="#244e70" stroke="#65a9dc"/>
  <text x="1375" y="418" class="h" text-anchor="middle">Locked learned actuator</text><text x="1375" y="445" class="b" text-anchor="middle">ID target -> rank-4 FD delta</text><text x="1375" y="470" class="s" text-anchor="middle">paired residual + guards</text>

  <path d="M1375 490v90" class="flow"/>
  <rect x="1190" y="580" width="340" height="105" class="box" fill="#743e35" stroke="#ee8e7a"/>
  <text x="1360" y="615" class="h" text-anchor="middle">Isaac PhysX plant</text><text x="1360" y="642" class="b" text-anchor="middle">persistent cylinder position targets</text><text x="1360" y="667" class="s" text-anchor="middle">live articulation and ground contact</text>
  <path d="M1190 632H1038v-142" class="fb"/>
  <path d="M1190 655H455v-165" class="fb"/>
  <text x="690" y="645" class="s">measured cylinders</text><text x="690" y="678" class="s">measured cutter position + clearance</text>

  <rect x="65" y="750" width="910" height="155" rx="22" fill="#142b29" stroke="#47d7a6" stroke-width="2"/>
  <text x="90" y="787" class="h">Verified arm behavior</text>
  <text x="90" y="820" class="b">SWEEP: 0.35 m lateral out + exact return · fixed truck-X · p95 3.44 cm · ground 100%</text>
  <text x="90" y="850" class="b">CURVE: 0.10 m forward bow + exact return · entirely in front · p95 3.54 cm · ground 100%</text>
  <text x="90" y="880" class="s">No RL · no MPC · no direct-drive acceptance · thresholds unchanged</text>

  <rect x="1010" y="750" width="520" height="155" rx="22" fill="#482d32" stroke="#ef7b86" stroke-width="2"/>
  <text x="1035" y="787" class="h">Open gate</text>
  <text x="1035" y="820" class="b">Wheel/brake transition is not repeatable after arm loading.</text>
  <text x="1035" y="850" class="b">Do not call the multi-station cycle production-green yet.</text>
  <text x="1035" y="880" class="s">RL remains disabled until this deterministic phase passes.</text>
</svg>
