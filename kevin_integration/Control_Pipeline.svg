<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400">
  <defs>
    <style>
      .title { font: 700 44px "DejaVu Sans", sans-serif; fill: #172033; }
      .subtitle { font: italic 23px "DejaVu Sans", sans-serif; fill: #44506a; }
      .box-title { font: 700 25px "DejaVu Sans", sans-serif; fill: #172033; }
      .body { font: 20px "DejaVu Sans", sans-serif; fill: #253047; }
      .small { font: 17px "DejaVu Sans", sans-serif; fill: #253047; }
      .tiny { font: 15px "DejaVu Sans", sans-serif; fill: #253047; }
      .label { font: 700 18px "DejaVu Sans", sans-serif; fill: #253047; }
      .white-title { font: 700 25px "DejaVu Sans", sans-serif; fill: white; }
      .line { fill: none; stroke: #263247; stroke-width: 4; }
      .feedback { fill: none; stroke: #268446; stroke-width: 4; }
      .latent { fill: none; stroke: #6d3fc0; stroke-width: 5; }
      .latent-dashed { fill: none; stroke: #6d3fc0; stroke-width: 4; stroke-dasharray: 12 9; }
      .success { fill: none; stroke: #df3737; stroke-width: 4; stroke-dasharray: 12 9; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#263247"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#268446"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6d3fc0"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#df3737"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#172033" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="2400" height="1400" fill="#fbfcfe"/>
  <text x="1200" y="62" text-anchor="middle" class="title">Fixed Final Task-Space Pose Control - PPO-ID-FD-Hydraulic ROM</text>
  <text x="1200" y="101" text-anchor="middle" class="subtitle">One robot-base end-effector target per episode | 73D observation | 4D PPO action | frozen learned models | no runtime IK</text>

  <!-- Final-pose target -->
  <g filter="url(#shadow)">
    <rect x="35" y="145" width="245" height="300" rx="24" fill="#eef6ff" stroke="#1764d2" stroke-width="4"/>
    <rect x="35" y="145" width="245" height="72" rx="24" fill="#1764d2"/>
    <rect x="35" y="192" width="245" height="25" fill="#1764d2"/>
  </g>
  <text x="157" y="181" text-anchor="middle" class="white-title">FINAL POSE TARGET</text>
  <text x="157" y="250" text-anchor="middle" class="body">sampled once at reset</text>
  <text x="157" y="285" text-anchor="middle" class="body">fixed for episode</text>
  <text x="157" y="320" text-anchor="middle" class="body">robot_base frame</text>
  <text x="157" y="360" text-anchor="middle" class="small">[x, y, z, qw, qx, qy, qz]</text>
  <text x="157" y="397" text-anchor="middle" class="small">shape: (N, 7)</text>

  <!-- Observation -->
  <g filter="url(#shadow)">
    <rect x="330" y="125" width="360" height="650" rx="24" fill="#f3efff" stroke="#6941b7" stroke-width="4"/>
    <rect x="330" y="125" width="360" height="76" rx="24" fill="#7354bd"/>
    <rect x="330" y="176" width="360" height="25" fill="#7354bd"/>
  </g>
  <text x="510" y="160" text-anchor="middle" class="white-title">TASK-SPACE OBSERVATION o_k</text>
  <text x="510" y="188" text-anchor="middle" class="white-title">(73 values)</text>
  <g class="small">
    <text x="360" y="235">0:7</text><text x="435" y="235">final target EE pose</text>
    <text x="360" y="271">7:14</text><text x="435" y="271">current EE pose</text>
    <text x="360" y="307">14:17</text><text x="435" y="307">position error</text>
    <text x="360" y="343">17:18</text><text x="435" y="343">orientation error</text>
    <text x="360" y="379">18:23</text><text x="435" y="379">mechanical q[5]</text>
    <text x="360" y="415">23:28</text><text x="435" y="415">mechanical qdot[5]</text>
    <text x="360" y="451">28:32</text><text x="435" y="451">cylinder position[4]</text>
    <text x="360" y="487">32:36</text><text x="435" y="487">cylinder velocity[4]</text>
    <text x="360" y="523">36:40</text><text x="435" y="523">previous Action[4]</text>
    <text x="360" y="559">40:44</text><text x="435" y="559">previous applied ValveCmd[4]</text>
    <text x="360" y="595" fill="#6d3fc0" font-weight="700">44:68</text><text x="435" y="595" fill="#6d3fc0" font-weight="700">z_arm_hat[24]</text>
    <text x="360" y="631">68:72</text><text x="435" y="631">normalized FD tau_hat[4]</text>
    <text x="360" y="667">72:73</text><text x="435" y="667">vehicle speed[1]</text>
  </g>
  <line x1="355" y1="704" x2="665" y2="704" stroke="#7354bd" stroke-width="3"/>
  <text x="510" y="745" text-anchor="middle" class="box-title">TOTAL = 73</text>

  <!-- PPO -->
  <g filter="url(#shadow)">
    <rect x="755" y="205" width="255" height="315" rx="24" fill="#fff8df" stroke="#d09a19" stroke-width="4"/>
    <rect x="755" y="205" width="255" height="72" rx="24" fill="#ffd86b"/>
    <rect x="755" y="252" width="255" height="25" fill="#ffd86b"/>
  </g>
  <text x="882" y="250" text-anchor="middle" class="box-title">PPO CONTROL POLICY</text>
  <text x="882" y="318" text-anchor="middle" class="body">input: o_k[73]</text>
  <text x="882" y="360" text-anchor="middle" class="body">output: Action[4]</text>
  <text x="882" y="409" text-anchor="middle" class="small">normalized desired</text>
  <text x="882" y="436" text-anchor="middle" class="small">hydraulic accelerations</text>
  <line x1="785" y1="463" x2="980" y2="463" stroke="#d09a19" stroke-width="2"/>
  <text x="882" y="495" text-anchor="middle" class="small">Stage 1 authority = 0.25</text>

  <!-- Action adapter -->
  <g filter="url(#shadow)">
    <rect x="1075" y="235" width="245" height="255" rx="24" fill="#f4f5f7" stroke="#596273" stroke-width="4"/>
    <rect x="1075" y="235" width="245" height="68" rx="24" fill="#dfe3e8"/>
    <rect x="1075" y="278" width="245" height="25" fill="#dfe3e8"/>
  </g>
  <text x="1197" y="278" text-anchor="middle" class="box-title">ACTION ADAPTER</text>
  <text x="1197" y="342" text-anchor="middle" class="small">ID feature-std scaling</text>
  <text x="1197" y="385" text-anchor="middle" class="body">qddot_cmd[5]</text>
  <text x="1197" y="426" text-anchor="middle" class="small">qddot_cmd[:, 4] = 0</text>
  <text x="1197" y="462" text-anchor="middle" class="small">shape invariant: (N, 5)</text>

  <!-- ID -->
  <g filter="url(#shadow)">
    <rect x="1385" y="150" width="285" height="405" rx="24" fill="#f4f5f7" stroke="#596273" stroke-width="4"/>
    <rect x="1385" y="150" width="285" height="72" rx="24" fill="#dfe3e8"/>
    <rect x="1385" y="197" width="285" height="25" fill="#dfe3e8"/>
  </g>
  <text x="1527" y="194" text-anchor="middle" class="box-title">FROZEN ID</text>
  <text x="1527" y="259" text-anchor="middle" class="small">inverse dynamics</text>
  <text x="1415" y="303" class="label">dynamic input:</text>
  <text x="1415" y="335" class="small">q[5], qdot[5], qddot_cmd[5], dP[4]</text>
  <text x="1415" y="382" class="label" fill="#6d3fc0">conditioning:</text>
  <text x="1415" y="414" class="small" fill="#6d3fc0">same stored z_arm_hat[24]</text>
  <line x1="1415" y1="448" x2="1640" y2="448" stroke="#596273" stroke-width="2"/>
  <text x="1527" y="488" text-anchor="middle" class="label">output: ValveCmd[4]</text>
  <text x="1527" y="525" text-anchor="middle" class="small">frozen + eval</text>

  <!-- ROM -->
  <g filter="url(#shadow)">
    <rect x="1750" y="145" width="330" height="470" rx="24" fill="#e9fbfb" stroke="#1595a0" stroke-width="4"/>
    <rect x="1750" y="145" width="330" height="82" rx="24" fill="#9ee5e1"/>
    <rect x="1750" y="202" width="330" height="25" fill="#9ee5e1"/>
  </g>
  <text x="1915" y="180" text-anchor="middle" class="box-title">VALVE-CONDITIONED</text>
  <text x="1915" y="211" text-anchor="middle" class="box-title">HYDRAULIC ROM</text>
  <text x="1780" y="265" class="label">input: 26 features</text>
  <text x="1780" y="303" class="small">ValveCmd[4] | dP[4]</text>
  <text x="1780" y="337" class="small">Extension[4] | ExtensionVelocity[4]</text>
  <text x="1780" y="371" class="small">JointPos[5] | JointVel[5]</text>
  <line x1="1780" y1="402" x2="2050" y2="402" stroke="#1595a0" stroke-width="2"/>
  <text x="1915" y="441" text-anchor="middle" class="body">ROM dt = 0.05 s</text>
  <text x="1915" y="482" text-anchor="middle" class="label">output:</text>
  <text x="1915" y="517" text-anchor="middle" class="body">DeltaExtension[4]</text>
  <text x="1915" y="558" text-anchor="middle" class="small">causal, ValveCmd conditioned</text>
  <text x="1915" y="588" text-anchor="middle" class="small">no z_arm_hat input</text>

  <!-- Physics / multirate -->
  <g filter="url(#shadow)">
    <rect x="2140" y="145" width="225" height="555" rx="24" fill="#edfae9" stroke="#3d8d37" stroke-width="4"/>
    <rect x="2140" y="145" width="225" height="82" rx="24" fill="#b9e7a8"/>
    <rect x="2140" y="202" width="225" height="25" fill="#b9e7a8"/>
  </g>
  <text x="2252" y="180" text-anchor="middle" class="box-title">MULTIRATE +</text>
  <text x="2252" y="211" text-anchor="middle" class="box-title">ISAACLAB</text>
  <text x="2252" y="268" text-anchor="middle" class="body">ratio = 5</text>
  <text x="2252" y="306" text-anchor="middle" class="small">0.05 s ROM delta</text>
  <text x="2252" y="335" text-anchor="middle" class="small">-> five 0.01 s updates</text>
  <line x1="2165" y1="365" x2="2340" y2="365" stroke="#3d8d37" stroke-width="2"/>
  <text x="2252" y="405" text-anchor="middle" class="small">coordinate adapter</text>
  <text x="2252" y="435" text-anchor="middle" class="small">limits + rate control</text>
  <text x="2252" y="465" text-anchor="middle" class="small">anti-windup safety</text>
  <line x1="2165" y1="495" x2="2340" y2="495" stroke="#3d8d37" stroke-width="2"/>
  <text x="2252" y="535" text-anchor="middle" class="label">single writer:</text>
  <text x="2252" y="568" text-anchor="middle" class="small">4 cylinder position targets</text>
  <text x="2252" y="604" text-anchor="middle" class="small">mechanical q[5], qdot[5]</text>
  <text x="2252" y="638" text-anchor="middle" class="small">EE pose + EE twist</text>
  <text x="2252" y="674" text-anchor="middle" class="tiny">Messerkopf_joint: follower only</text>

  <!-- Main forward flow -->
  <path d="M280 290 H330" class="line" marker-end="url(#arrow)"/>
  <path d="M690 330 H755" class="line" marker-end="url(#arrow)"/>
  <path d="M1010 360 H1075" class="line" marker-end="url(#arrow)"/>
  <path d="M1320 360 H1385" class="line" marker-end="url(#arrow)"/>
  <path d="M1670 360 H1750" class="line" marker-end="url(#arrow)"/>
  <text x="1710" y="342" text-anchor="middle" class="label">ValveCmd[4]</text>
  <path d="M2080 360 H2140" class="line" marker-end="url(#arrow)"/>

  <!-- AAM -->
  <g filter="url(#shadow)">
    <rect x="670" y="865" width="430" height="390" rx="24" fill="#f4f5f7" stroke="#596273" stroke-width="4"/>
    <rect x="670" y="865" width="430" height="74" rx="24" fill="#dfe3e8"/>
    <rect x="670" y="914" width="430" height="25" fill="#dfe3e8"/>
  </g>
  <text x="885" y="911" text-anchor="middle" class="box-title">FROZEN ARM ADAPTATION MODULE</text>
  <text x="700" y="978" class="label">checkpoint:</text>
  <text x="845" y="978" class="small">aam.pth</text>
  <text x="700" y="1015" class="label">history:</text>
  <text x="845" y="1015" class="small">(N, 100, 18)</text>
  <text x="700" y="1052" class="small">q[5], qdot[5], dP[4],</text>
  <text x="700" y="1081" class="small">previous applied ValveCmd[4]</text>
  <line x1="700" y1="1110" x2="1070" y2="1110" stroke="#596273" stroke-width="2"/>
  <text x="700" y="1148" class="label">output:</text>
  <text x="845" y="1148" class="body" fill="#6d3fc0">z_arm_hat[24]</text>
  <text x="700" y="1188" class="small">frozen + eval + inference mode</text>
  <text x="700" y="1219" class="small">context only - no direct actuation</text>
  <text x="700" y="1248" class="tiny">System Factor Encoder: offline only</text>

  <!-- FD -->
  <g filter="url(#shadow)">
    <rect x="1190" y="885" width="365" height="325" rx="24" fill="#f4f5f7" stroke="#596273" stroke-width="4"/>
    <rect x="1190" y="885" width="365" height="72" rx="24" fill="#dfe3e8"/>
    <rect x="1190" y="932" width="365" height="25" fill="#dfe3e8"/>
  </g>
  <text x="1372" y="930" text-anchor="middle" class="box-title">FROZEN FD OBSERVER</text>
  <text x="1220" y="997" class="label">input:</text>
  <text x="1220" y="1031" class="small">q[5], qdot[5], dP[4], ValveCmd[4]</text>
  <text x="1220" y="1075" class="label">output:</text>
  <text x="1322" y="1075" class="body">tau_hat[4]</text>
  <line x1="1220" y1="1105" x2="1525" y2="1105" stroke="#596273" stroke-width="2"/>
  <text x="1372" y="1145" text-anchor="middle" class="small">observer only - no effort actuation</text>
  <text x="1372" y="1180" text-anchor="middle" class="small">observation + load/safety telemetry</text>

  <!-- Success -->
  <g filter="url(#shadow)">
    <rect x="1660" y="825" width="420" height="420" rx="24" fill="#fff0ef" stroke="#df3737" stroke-width="4"/>
    <rect x="1660" y="825" width="420" height="72" rx="24" fill="#ffb7b0"/>
    <rect x="1660" y="872" width="420" height="25" fill="#ffb7b0"/>
  </g>
  <text x="1870" y="870" text-anchor="middle" class="box-title">FINAL-POSE SUCCESS + SETTLING</text>
  <text x="1690" y="940" class="body">position error &lt;= 0.05 m</text>
  <text x="1690" y="979" class="body">orientation geodesic error &lt;= 5 deg</text>
  <text x="1690" y="1018" class="body">EE linear speed &lt;= 0.05 m/s</text>
  <text x="1690" y="1057" class="body">EE angular speed &lt;= 0.10 rad/s</text>
  <text x="1690" y="1096" class="body">hold 50 consecutive steps = 0.5 s</text>
  <line x1="1690" y1="1128" x2="2050" y2="1128" stroke="#df3737" stroke-width="2"/>
  <text x="1690" y="1167" class="body">separate success termination</text>
  <text x="1690" y="1206" class="body">one-time bonus = 10.0</text>

  <!-- Feedback buses -->
  <path d="M2252 700 V770 H510 V775" class="feedback" marker-end="url(#arrow-green)"/>
  <text x="1440" y="754" text-anchor="middle" class="label" fill="#268446">measured state: q, qdot, cylinder state, dP, EE pose, EE twist</text>
  <path d="M2252 700 V805 H885 V865" class="feedback" marker-end="url(#arrow-green)"/>
  <path d="M2252 700 V825 H1372 V885" class="feedback" marker-end="url(#arrow-green)"/>
  <path d="M2252 700 V790 H1870 V825" class="feedback" marker-end="url(#arrow-green)"/>

  <!-- ValveCmd branches: ID -> ROM, FD, and next AAM history -->
  <path d="M1670 500 H1715 V1030 H1555" class="line" marker-end="url(#arrow)"/>
  <text x="1632" y="1010" class="small">ValveCmd[4] from ID</text>
  <path d="M1715 500 V820 H1080 V865" class="latent-dashed" marker-end="url(#arrow-purple)"/>
  <text x="1375" y="806" text-anchor="middle" class="small" fill="#6d3fc0">previous applied ValveCmd[4] on the next observed state</text>

  <!-- AAM output: exactly two destinations -->
  <path d="M670 1138 H610 V700 H510 V775" class="latent" marker-end="url(#arrow-purple)"/>
  <text x="450" y="830" text-anchor="middle" class="small" fill="#6d3fc0">z_arm_hat[24]</text>
  <text x="450" y="854" text-anchor="middle" class="tiny" fill="#6d3fc0">observation indices 44:68</text>
  <path d="M1100 1140 H1145 V760 H1527 V555" class="latent" marker-end="url(#arrow-purple)"/>
  <text x="1325" y="738" text-anchor="middle" class="small" fill="#6d3fc0">same stored z_arm_hat[24] -> ID only</text>

  <!-- FD output to observation -->
  <path d="M1190 1080 H1155 V790 H630 V775" class="line" marker-end="url(#arrow)"/>
  <text x="895" y="813" text-anchor="middle" class="tiny">normalized tau_hat[4] -> observation 68:72</text>

  <!-- Quaternion note -->
  <rect x="35" y="500" width="245" height="180" rx="20" fill="#eef6ff" stroke="#1764d2" stroke-width="3"/>
  <text x="157" y="540" text-anchor="middle" class="label" fill="#1764d2">QUATERNION GEODESIC</text>
  <text x="157" y="580" text-anchor="middle" class="small">2 acos(|q_target dot q_current|)</text>
  <text x="157" y="620" text-anchor="middle" class="small">quaternion order:</text>
  <text x="157" y="653" text-anchor="middle" class="small">[qw, qx, qy, qz]</text>

  <!-- Success reset loop -->
  <path d="M1870 1245 V1300 H157 V445" class="success" marker-end="url(#arrow-red)"/>
  <text x="1000" y="1290" text-anchor="middle" class="label" fill="#df3737">success termination -> reset selected environment -> sample one new fixed target</text>

  <!-- Preserved contract strip -->
  <rect x="310" y="1320" width="1780" height="62" rx="18" fill="#f7fbff" stroke="#1754a6" stroke-width="4"/>
  <text x="345" y="1360" class="label" fill="#1754a6">PRESERVED:</text>
  <text x="490" y="1360" class="body">Observation 73 | PPO Action 4 | q/qdot 5 | qddot_cmd 5 | ID Output 4 | ValveCmd 4 | FD Output 4 | ROM Output 4 | Cylinder Targets 4</text>
</svg>
